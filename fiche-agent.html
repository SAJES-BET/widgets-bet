<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#14213d;--mut:#5b6478;--line:#dde2ec;--acc:#1f4fd8;--ok:#15803d;--warn:#c2740c;--ko:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#161a24;--card:#1f2432;--ink:#eef1f7;--mut:#9aa3b8;--line:#323a4e;--acc:#7da2ff;--ok:#4ade80;--warn:#fbbf24;--ko:#f87171}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Segoe UI",sans-serif}
header{display:flex;gap:16px;align-items:center;padding-bottom:14px;margin-bottom:16px;border-bottom:3px solid var(--acc)}
.av{flex:none;width:60px;height:60px;border-radius:50%;background:var(--acc);color:var(--bg);display:grid;place-items:center;font:600 22px Georgia,serif}
h1{font:600 26px/1.2 Georgia,"Iowan Old Style",serif;margin:0}
.sub{color:var(--mut)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:12px;margin-right:6px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
.facts{display:flex;gap:28px;flex-wrap:wrap}
.facts b{display:block;font:600 22px Georgia,serif}.facts span{color:var(--mut);font-size:12px}
.cap{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--line);margin:8px 0}
.cap i{display:block;height:100%;border-right:2px solid var(--card)}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.empty{color:var(--mut)}
</style></head>
<body><div id="app" class="empty">Sélectionnez un agent dans la liste.</div>
<script>
grist.ready({requiredAccess:'read table'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col=p=>p>100?'var(--ko)':p>=85?'var(--warn)':'var(--ok)';
const palette=['#1f4fd8','#0f8b8d','#c2410c','#7c3aed','#be185d','#65a30d','#0369a1','#a16207'];
const num=v=>Math.round((v||0)*10)/10;
function render(r){
  let ps=[];try{ps=JSON.parse(r.Projets_json||'[]')}catch(e){}
  const cap=r.Capacite_annuelle||0,pct=Math.round((r.Taux_occupation||0)*100);
  const plan=ps.reduce((s,x)=>s+(x.p||0),0);
  const base=Math.max(cap,plan,1);
  const segs=ps.map((x,i)=>`<i style="width:${(x.p||0)/base*100}%;background:${palette[i%palette.length]}" title="${esc(x.t)} : ${num(x.p)} j"></i>`).join('');
  const ini=((r.Prenom||'')[0]||(r.Nom_complet||'?')[0]).toUpperCase();
  document.getElementById('app').className='';
  document.getElementById('app').innerHTML=`
  <header><div class="av">${esc(ini)}</div><div>
    <h1>${esc(r.Nom_complet)}</h1><div class="sub">${esc(r.Fonction)||'Fonction non renseignée'}${r.Email?' · '+esc(r.Email):''}</div>
    <div style="margin-top:6px">${r.Referent_suivi?'<span class="pill">Référent·e de suivi</span>':''}${r.Actif?'':'<span class="pill">Inactif·ve</span>'}</div></div></header>
  <section><div class="facts">
    <div><b>${r.Nb_projets_actifs||0}</b><span>projets en cours</span></div>
    <div><b>${r.Nb_projets_suivis||0}</b><span>projets suivis</span></div>
    <div><b>${num(r.Charge_reelle_annee)} j</b><span>réalisés cette année</span></div>
    <div><b>${cap} j</b><span>capacité annuelle</span></div></div></section>
  <section><h2>Occupation sur l’année : ${pct} %</h2>
    <div class="meter"><i style="width:${Math.min(pct,100)}%;background:${col(pct)}"></i></div>
    <h2 style="margin-top:14px">Charge prévue par projet (${num(plan)} j sur ${cap} j)</h2>
    <div class="cap">${segs}</div></section>
  <section><h2>Projets portés</h2>
    ${ps.map((x,i)=>`<div class="row"><span><i class="sw" style="background:${palette[i%palette.length]}"></i>${esc(x.t)} <span class="sub">(${esc(x.s)})</span></span><span>${num(x.r)} / ${num(x.p)} j</span></div>`).join('')||'<div class="empty">Aucun projet pour le moment.</div>'}</section>`;
}
grist.onRecord(r=>{if(r)render(r)});
</script></body></html>
