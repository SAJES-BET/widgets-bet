<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#14213d;--mut:#5b6478;--line:#dde2ec;--acc:#1f4fd8;--acc2:#9db4f5;--ok:#15803d;--warn:#c2740c;--ko:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#161a24;--card:#1f2432;--ink:#eef1f7;--mut:#9aa3b8;--line:#323a4e;--acc:#7da2ff;--acc2:#3b4f86;--ok:#4ade80;--warn:#fbbf24;--ko:#f87171}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Segoe UI",sans-serif}
header{padding-bottom:12px;margin-bottom:14px;border-bottom:3px solid var(--acc)}
h1{font:600 26px/1.2 Georgia,"Iowan Old Style",serif;margin:0 0 8px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip,select{font:inherit;font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.facts{display:flex;gap:28px;flex-wrap:wrap}
.facts b{display:block;font:600 24px Georgia,serif}.facts span{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--line);margin-bottom:8px}
.stack i{display:block;height:100%;border-right:2px solid var(--card)}
.lg{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:12px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.bl{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;padding:4px 0}
.bl .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--acc);margin:1px 0}.bar.b{background:var(--acc2)}
.num{text-align:right;color:var(--mut);font-size:12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.sub{color:var(--mut);font-size:12px}
.ko{color:var(--ko)}.warn{color:var(--warn)}.empty{color:var(--mut)}

button.pill{font:inherit;font-size:12px;cursor:pointer;color:var(--ink)}
table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;text-align:right;border-top:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500;font-size:12px;border-top:0}
@media print{:root{--bg:#fff;--card:#fff;--ink:#14213d;--mut:#5b6478;--line:#dde2ec;--acc:#1f4fd8;--acc2:#9db4f5;--ok:#15803d;--warn:#c2740c;--ko:#c62828}body{padding:0}.noprint{display:none!important}section{break-inside:avoid}}
</style></head>
<body><div id="app" class="empty">Chargement des projets…</div>
<script>
grist.ready({requiredAccess:'read table'});
const STAT=['À cadrer','En cours','En pause','Terminé','Archivé'];
const COL={'À cadrer':'#9db4f5','En cours':'#1f4fd8','En pause':'#c2740c','Terminé':'#15803d','Archivé':'#8b93a7'};
let recs=[],hidden=new Set(['Archivé']),year='all',tab='ens';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toD=v=>{if(v===null||v===undefined||v==='')return null;const d=typeof v==='number'?new Date(v*1000):new Date(v);return isNaN(d)?null:d};
const num=v=>Math.round((v||0)*10)/10;
const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const grp=(a,k)=>{const m={};a.forEach(x=>{const g=x[k]||'Non renseigné';(m[g]=m[g]||[]).push(x)});return Object.entries(m).sort((p,q)=>q[1].length-p[1].length)};
function render(){
  const years=[...new Set(recs.map(r=>r.Annee).filter(Boolean))].sort();
  const f=recs.filter(r=>!hidden.has(r.Statut)&&(year==='all'||r.Annee==year));
  const prev=sum(f,'Charge_prevue'),reel=sum(f,'Charge_reelle');
  const late=f.filter(r=>r.Retard),over=f.filter(r=>r.Taux_conso>1);
  const watch=f.filter(r=>r.Statut==='En cours'&&(r.Retard||r.Taux_conso>=0.8)).sort((a,b)=>b.Taux_conso-a.Taux_conso);
  const today=new Date();today.setHours(0,0,0,0);
  const jal=f.filter(r=>r.Statut==='En cours'&&toD(r.Date_prochain_jalon)).sort((a,b)=>toD(a.Date_prochain_jalon)-toD(b.Date_prochain_jalon)).slice(0,6);
  const byStat=STAT.map(s=>[s,f.filter(r=>r.Statut===s).length]).filter(x=>x[1]);
  const byType=grp(f,'Type_nom'),byNiv=grp(f,'Niveau_commanditaire');
  const mx=Math.max(1,...byType.map(([,a])=>Math.max(sum(a,'Charge_prevue'),sum(a,'Charge_reelle'))));
  const mn=Math.max(1,...byNiv.map(([,a])=>a.length));
  document.getElementById('app').className='';
  document.getElementById('app').innerHTML=`
  <header><h1>Activité du bureau : projets</h1><div class="noprint" style="display:flex;gap:6px;margin-bottom:8px"><button class="chip ${tab==='ens'?'on':''}" data-t="ens">Vue d’ensemble</button><button class="chip ${tab==='an'?'on':''}" data-t="an">Par année</button><button class="chip" id="csv">Exporter en CSV</button><button class="chip" id="pdf">Imprimer / PDF</button></div><div class="filters noprint">
    ${STAT.map(s=>`<button class="chip ${hidden.has(s)?'':'on'}" data-s="${s}">${s}</button>`).join('')}
    <select id="yr" style="${tab==='an'?'display:none':''}"><option value="all">Toutes les années</option>${years.map(y=>`<option ${y==year?'selected':''}>${y}</option>`).join('')}</select></div></header>
  ${tab==='an'?yearView(recs.filter(r=>!hidden.has(r.Statut))):`<section><div class="facts">
    <div><b>${f.length}</b><span>projets affichés</span></div>
    <div><b>${num(prev)} j</b><span>charge prévue</span></div>
    <div><b>${num(reel)} j</b><span>charge réelle (${prev?Math.round(reel/prev*100):0} %)</span></div>
    <div><b class="${late.length?'ko':''}">${late.length}</b><span>en retard</span></div>
    <div><b class="${over.length?'ko':''}">${over.length}</b><span>en dépassement de charge</span></div></div></section>
  <div class="grid">
  <section><h2>Répartition par statut</h2>
    <div class="stack">${byStat.map(([s,n])=>`<i style="width:${n/f.length*100}%;background:${COL[s]}" title="${s} : ${n}"></i>`).join('')}</div>
    <div class="lg">${byStat.map(([s,n])=>`<span><i class="sw" style="background:${COL[s]}"></i>${s} (${n})</span>`).join('')||'Aucun projet'}</div></section>
  <section><h2>Charge par type (prévue en clair, réelle en foncé)</h2>
    ${byType.map(([t,a])=>`<div class="bl"><span class="t" title="${esc(t)}">${esc(t)}</span><div><div class="bar b" style="width:${sum(a,'Charge_prevue')/mx*100}%"></div><div class="bar" style="width:${sum(a,'Charge_reelle')/mx*100}%"></div></div><span class="num">${a.length} proj.</span></div>`).join('')||'<div class="empty">Aucune donnée</div>'}</section>
  <section><h2>Projets par niveau de commanditaire</h2>
    ${byNiv.map(([t,a])=>`<div class="bl"><span class="t">${esc(t)}</span><div class="bar" style="width:${a.length/mn*100}%"></div><span class="num">${a.length}</span></div>`).join('')||'<div class="empty">Aucune donnée</div>'}</section></div>
  <div class="grid">
  <section><h2>À surveiller</h2>${watch.map(r=>`<div class="row"><span>${esc(r.Titre)} <span class="sub">${esc(r.Agent_nom)}</span></span><span class="${r.Retard||r.Taux_conso>1?'ko':'warn'}">${r.Retard?'Retard · ':''}${Math.round(r.Taux_conso*100)} %</span></div>`).join('')||'<div class="empty">Rien à signaler.</div>'}</section>
  <section><h2>Prochains jalons</h2>${jal.map(r=>{const d=toD(r.Date_prochain_jalon);return `<div class="row"><span>${esc(r.Prochain_jalon)} <span class="sub">${esc(r.Titre)}</span></span><span class="${d<today?'ko':''}">${d.toLocaleDateString('fr-FR')}</span></div>`}).join('')||'<div class="empty">Aucun jalon à venir.</div>'}</section></div>`}`;
  document.querySelectorAll('.chip[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  document.getElementById('csv').onclick=()=>exportCsv(tab==='an'?recs.filter(r=>!hidden.has(r.Statut)):f);
  document.getElementById('pdf').onclick=EXP.pdf;
  document.querySelectorAll('.chip[data-s]').forEach(b=>b.onclick=()=>{hidden.has(b.dataset.s)?hidden.delete(b.dataset.s):hidden.add(b.dataset.s);render()});
  document.getElementById('yr').onchange=e=>{year=e.target.value;render()};
}
const EXP={csv(n,rows){const t=rows.map(r=>r.map(c=>'"'+(typeof c==='number'?String(c).replace('.',','):String(c??'')).replace(/"/g,'""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8'}));a.download=n+'.csv';document.body.appendChild(a);a.click();a.remove()},pdf(){try{window.print()}catch(e){alert('Impression bloquée : utilisez Ctrl+P sur la page Grist.')}}};
const fd=v=>{const d=toD(v);return d?d.toLocaleDateString('fr-FR'):''};
function exportCsv(a){EXP.csv('synthese-projets',[['Référence','Titre','Type','Statut','Niveau commanditaire','Commanditaire','Bénéficiaire','Agents','Suivi','Année','Début','Fin prévue','Charge prévue','Charge réelle','Taux de consommation','En retard']].concat(a.map(r=>[r.Reference,r.Titre,r.Type_nom,r.Statut,r.Niveau_commanditaire,r.Commanditaire,r.Beneficiaire,r.Agent_nom,r.Suivi_nom,r.Annee,fd(r.Date_debut),fd(r.Date_fin_prevue),r.Charge_prevue,r.Charge_reelle,Math.round((r.Taux_conso||0)*100)+' %',r.Retard?'Oui':'Non'])))}
function yearView(a){
  const m=grp(a,'Annee').sort((p,q)=>String(p[0]).localeCompare(String(q[0])));
  const mx=Math.max(1,...m.map(([,x])=>Math.max(sum(x,'Charge_prevue'),sum(x,'Charge_reelle'))));
  if(!m.length)return '<section class="empty">Aucun projet pour ces statuts.</section>';
  return `<section><h2>Bilan par année</h2><div class="sub" style="margin-bottom:8px">Un projet est rattaché à l’année de sa date de début.</div>
  <table><tr><th>Année</th><th>Projets</th><th>Terminés</th><th>Prévu (j)</th><th>Réel (j)</th><th>Conso</th><th>En retard</th></tr>
  ${m.map(([y,x])=>{const p=sum(x,'Charge_prevue'),r=sum(x,'Charge_reelle'),l=x.filter(z=>z.Retard).length;return `<tr><td>${y}</td><td>${x.length}</td><td>${x.filter(z=>z.Statut==='Terminé').length}</td><td>${num(p)}</td><td>${num(r)}</td><td>${p?Math.round(r/p*100)+' %':'—'}</td><td class="${l?'ko':''}">${l}</td></tr>`}).join('')}</table></section>
  <section><h2>Charge prévue (clair) et réelle (foncé)</h2>${m.map(([y,x])=>`<div class="bl"><span class="t">${y}</span><div><div class="bar b" style="width:${sum(x,'Charge_prevue')/mx*100}%"></div><div class="bar" style="width:${sum(x,'Charge_reelle')/mx*100}%"></div></div><span class="num">${x.length} proj.</span></div>`).join('')}</section>`}
grist.onRecords(r=>{recs=r;render()});
</script></body></html>
