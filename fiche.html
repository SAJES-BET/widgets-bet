<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fiche</title>
<script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>
<style>
:root{--bg:#11131b;--card:#181b25;--field:#232734;--line:#2c3140;--txt:#e8eaf0;--mut:#9aa0b4;--acc:#5b8cff;--ok:#3fb67a;--warn:#f0a43c;--bad:#f26b6b}
@media (prefers-color-scheme:light){:root{--bg:#f6f7fb;--card:#fff;--field:#eef0f6;--line:#d9dce7;--txt:#1b1f2a;--mut:#626a80;--acc:#2f5fd8}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
#bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
#bar .sp{flex:1}
button,select{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover,select:hover{border-color:var(--acc)}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.nav{width:36px;padding:6px 0;font-size:15px}
button:disabled{opacity:.35;cursor:default;border-color:var(--line)}
#sel{min-width:220px;max-width:420px;flex:0 1 380px}
#cnt{color:var(--mut);font-variant-numeric:tabular-nums;min-width:56px}
main{flex:1;overflow:auto;padding:18px 16px 28px}
.wrap{max-width:860px;margin:0 auto}
.eyebrow{color:var(--mut);font-size:13px}
h1{font:700 30px/1.2 Georgia,"Times New Roman",serif;margin:2px 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:13px}
.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.bad{border-color:var(--bad);color:var(--bad)}
.head{display:flex;gap:16px;align-items:center;padding-bottom:14px;border-bottom:3px solid var(--acc);margin-bottom:16px}
.avatar{flex:none;width:64px;height:64px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font:700 28px Georgia,serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:16px}
.bar{height:12px;border-radius:99px;background:var(--field);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar>i.warn{background:var(--warn)}.bar>i.bad{background:var(--bad)}.bar>i.acc{background:var(--acc)}
.row{display:flex;gap:10px;margin:6px 0}.row .k{flex:0 0 120px;color:var(--mut)}.row .v{font-weight:600}
.tl{position:relative;height:6px;background:var(--field);border-radius:99px;margin:30px 4px 10px}
.tl>i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:99px}
.tl>b{position:absolute;top:-12px;bottom:-12px;width:2px;background:var(--bad)}
.tl>b span{position:absolute;top:-16px;left:4px;white-space:nowrap;color:var(--bad);font-size:12px;font-weight:400}
.tl>b.r span{left:auto;right:4px}
.dates{display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi b{display:block;font:700 26px Georgia,serif}.kpi span{color:var(--mut);font-size:12px}
.ms{display:flex;align-items:center;gap:10px;padding:5px 0}
.dot{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--mut)}
.dot.ok{background:var(--ok);border-color:var(--ok)}.dot.bad{background:var(--bad);border-color:var(--bad)}
.ms .d{margin-left:auto;color:var(--mut)}
.pj{padding:8px 0;border-top:1px solid var(--line)}.pj:first-of-type{border-top:0}
.pj .t{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}
.muted{color:var(--mut)}
.desc{white-space:pre-wrap}
.empty{max-width:860px;margin:60px auto;text-align:center;color:var(--mut)}
/* ---- Calendrier : bascule, frise, rétroplanning ---- */
.dot.acc{background:var(--acc);border-color:var(--acc)}.dot.fin{border-color:var(--acc)}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.cal-h h2{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:5px 12px}
.seg button.on{background:var(--acc);color:#fff}
.cal-sum{margin:0 0 12px;font-size:13px;color:var(--mut)}.cal-sum.bad{color:var(--bad);font-weight:600}
.cvt{display:none;font-weight:700;margin:10px 0 6px}
.cal[data-view="frise"] .cv-retro,.cal[data-view="retro"] .cv-frise{display:none}
.cv svg{display:block;width:100%;height:auto}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mut);font-size:12px;margin-top:8px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lgd{width:11px;height:11px;border-radius:50%;display:inline-block;border:2px solid var(--mut)}
.lgd.deb{background:var(--acc);border-color:var(--acc)}.lgd.fin{border-color:var(--acc)}
.lgd.ok{background:var(--ok);border-color:var(--ok)}.lgd.bad{background:var(--bad);border-color:var(--bad)}
.lgl{width:2px;height:12px;background:var(--bad);display:inline-block}
.sv-t{fill:var(--txt);font-size:14px;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.sv-b{font-weight:700}.sv-d{fill:var(--mut)}
.sv-track{fill:var(--field)}.sv-prog{fill:var(--acc)}.sv-prog.ok{fill:var(--ok)}.sv-prog.bad{fill:var(--bad)}
.sv-lead{stroke:var(--line);stroke-width:1.5}
.sv-m{stroke:var(--card);stroke-width:2.5}
.sv-m.deb{fill:var(--acc)}.sv-m.fin{fill:var(--card);stroke:var(--acc);stroke-width:3.5}
.sv-m.ok{fill:var(--ok)}.sv-m.bad{fill:var(--bad)}.sv-m.todo{fill:var(--card);stroke:var(--mut);stroke-width:3}
.sv-todayl{stroke:var(--bad);stroke-width:2}.sv-today{fill:var(--bad);font-weight:700}
.rp-h,.rp-r{display:grid;grid-template-columns:minmax(140px,240px) 1fr 84px;gap:12px;align-items:center}
.rp-h{color:var(--mut);font-size:12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rp-h span:last-child,.rp-j{text-align:right}
.rp-r{padding:8px 0;border-bottom:1px solid var(--line)}.rp-r:last-of-type{border-bottom:0}
.rp-l{display:flex;gap:8px;align-items:center;min-width:0}
.rp-l b{display:block;overflow-wrap:anywhere}.rp-l small{color:var(--mut)}
.rp-t{position:relative;height:22px;margin:0 8px}
.rp-t:before{content:"";position:absolute;left:-8px;right:-8px;top:50%;height:2px;margin-top:-1px;background:var(--field)}
.rp-bar{position:absolute;top:50%;height:10px;margin-top:-5px;border-radius:99px;background:var(--acc)}
.rp-bar.ok{background:var(--ok)}.rp-bar.bad{background:var(--bad)}
.rp-mk{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}
.rp-mk.ok{background:var(--ok)}.rp-mk.bad{background:var(--bad)}
.rp-mk.fin{background:var(--card);border-color:var(--acc);border-width:3px}
.rp-td{position:absolute;top:-8px;bottom:-8px;width:2px;margin-left:-1px;background:var(--bad)}
.rp-j{font-variant-numeric:tabular-nums;font-weight:700}.rp-j small{display:block;font-weight:400;color:var(--mut)}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}.rp-h,.rp-r{grid-template-columns:1fr 70px}.rp-h span:nth-child(2){display:none}.rp-t{grid-column:1 / -1;grid-row:2}}
@page{margin:12mm}
@media print{
 :root{--bg:#fff;--card:#fff;--field:#e3e6ee;--line:#c9cdd8;--txt:#000;--mut:#444;--acc:#2f5fd8}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #bar,.seg{display:none}
 html,body{height:auto;overflow:visible}body{display:block;background:#fff}main{overflow:visible;padding:0}
 .card{break-inside:avoid;box-shadow:none}
 .cal{break-inside:auto}
 .cal .cv{display:block!important;break-inside:avoid}.cal .cv+.cv{margin-top:18px}
 .cvt{display:block}
 .rp-r{break-inside:avoid}
}
</style>
</head>
<body>
<header id="bar" role="toolbar" aria-label="Navigation entre les fiches">
  <button class="nav" id="prev" title="Fiche précédente (←)" aria-label="Fiche précédente">◀</button>
  <select id="sel" aria-label="Choisir une fiche"></select>
  <button class="nav" id="next" title="Fiche suivante (→)" aria-label="Fiche suivante">▶</button>
  <span id="cnt" aria-live="polite"></span>
  <span class="sp"></span>
  <button id="print">Imprimer / PDF</button>
  <button id="csv">Exporter en CSV</button>
</header>
<main><div class="wrap" id="fiche"></div></main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => Number(v) || 0;
const fmtN = v => (Math.round(num(v) * 10) / 10).toLocaleString('fr-FR');
const pct = v => Math.round(num(v) * 100);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const fmtD = v => {
  if (v == null || v === '') return '';
  const d = typeof v === 'number' ? new Date(v * 1000) : new Date(v);
  return isNaN(d) ? '' : d.toLocaleDateString('fr-FR', {timeZone: 'UTC'});
};
const level = t => t > 1 ? 'bad' : t >= 0.8 ? 'warn' : '';
const parse = s => { try { return JSON.parse(s || '[]'); } catch (e) { return []; } };

let rows = [], cur = null, mode = null;

function label(r) {
  if (mode === 'projet') {
    const ref = (r.Reference || '').trim(), t = (r.Titre || '').trim();
    return (ref && t ? ref + ' — ' + t : ref || t) || '(Fiche sans titre)';
  }
  return ((r.Nom_complet || '').trim() || '(Sans nom)') + (r.Actif === false ? ' (inactif)' : '');
}

/* ---------- Calendrier : frise chronologique + rétroplanning ---------- */
const DAY = 86400;
let calView = 'frise';
const toSec = v => {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return v;
  const t = v instanceof Date ? v.getTime() : Date.parse(v);
  return isNaN(t) ? null : t / 1000;
};
const jLabel = (fin, t) => { const d = Math.round((fin - t) / DAY); return d > 0 ? 'J-' + d : d === 0 ? 'J' : 'J+' + (-d); };
const plural = (n, w) => n + ' ' + w + (n > 1 ? 's' : '');

function calData(r) {
  const n = new Date();
  const c = {
    deb: toSec(r.Date_debut), fin: toSec(r.Date_fin_prevue), reel: toSec(r.Date_fin_reelle),
    now: Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / 1000,
    jal: parse(r.Jalons_json).filter(j => j.l || j.d).map(j => ({l: j.l || '(Sans libellé)', t: toSec(j.d), s: j.s}))
  };
  c.jal.forEach(j => { j.late = j.s === 'En retard' || (j.t != null && j.t < c.now && j.s !== 'Atteint'); });
  c.overdue = c.fin != null && c.reel == null && c.now > c.fin;
  return c;
}

function frise(c) {
  const items = [];
  if (c.deb != null) items.push({t: c.deb, l: 'Début', k: 'deb'});
  c.jal.forEach(j => { if (j.t != null) items.push({t: j.t, l: j.l, k: j.s === 'Atteint' ? 'ok' : j.late ? 'bad' : 'todo'}); });
  if (c.fin != null) items.push({t: c.fin, l: 'Fin prévue', k: 'fin'});
  if (c.reel != null) items.push({t: c.reel, l: 'Fin réelle', k: 'ok'});
  if (!items.length) return '<div class="muted">Aucune date renseignée.</div>';

  let mn = Math.min(...items.map(i => i.t)), mx = Math.max(...items.map(i => i.t));
  if (c.overdue) mx = Math.max(mx, c.now);
  if (mx - mn < DAY) mx = mn + DAY * 30;
  const W = 860, x0 = 50, x1 = W - 50, X = t => x0 + (t - mn) / (mx - mn) * (x1 - x0);

  items.sort((a, b) => a.t - b.t);
  const ends = [];
  items.forEach(it => {
    it.txt = it.l.length > 28 ? it.l.slice(0, 27) + '…' : it.l;
    it.ds = fmtD(it.t);
    it.w = Math.max(it.txt.length * 8.6, it.ds.length * 7.8) + 14;
    it.x = X(it.t);
    it.tx = clamp(it.x, it.w / 2, W - it.w / 2);
    let k = 0;
    while (ends[k] !== undefined && ends[k] > it.tx - it.w / 2 - 6) k++;
    ends[k] = it.tx + it.w / 2;
    it.lane = k;
  });
  const laneH = 46, axisY = 24 + ends.length * laneH + 16, H = axisY + 58;
  const ly = it => axisY - 16 - it.lane * laneH;

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Frise chronologique du projet"><title>Frise chronologique</title>`;
  s += `<rect class="sv-track" x="${x0}" y="${axisY - 4}" width="${x1 - x0}" height="8" rx="4"/>`;
  if (c.deb != null) {
    const end = c.reel != null ? c.reel : Math.min(c.now, mx);
    if (end > c.deb) s += `<rect class="sv-prog ${c.reel != null ? 'ok' : c.overdue ? 'bad' : ''}" x="${X(c.deb)}" y="${axisY - 4}" width="${X(end) - X(c.deb)}" height="8" rx="4"/>`;
  }
  items.forEach(it => { s += `<line class="sv-lead" x1="${it.x}" y1="${axisY - 7}" x2="${it.x}" y2="${ly(it) + 4}"/>`; });
  if (c.now >= mn && c.now <= mx) {
    const nx = X(c.now);
    s += `<line class="sv-todayl" x1="${nx}" y1="${axisY - 12}" x2="${nx}" y2="${axisY + 26}"/>`;
    s += `<text class="sv-t sv-today" x="${clamp(nx, 80, W - 80)}" y="${axisY + 42}" text-anchor="middle">Aujourd’hui · ${fmtD(c.now)}</text>`;
  }
  items.forEach(it => {
    s += `<circle class="sv-m ${it.k}" cx="${it.x}" cy="${axisY}" r="7"/>`;
    s += `<text class="sv-t sv-b" x="${it.tx}" y="${ly(it) - 17}" text-anchor="middle">${esc(it.txt)}</text>`;
    s += `<text class="sv-t sv-d" x="${it.tx}" y="${ly(it)}" text-anchor="middle">${it.ds}</text>`;
  });
  s += '</svg>';
  s += `<div class="lg"><span><i class="lgd deb"></i>Début</span><span><i class="lgd fin"></i>Fin prévue</span>
    <span><i class="lgd ok"></i>Atteint / fin réelle</span><span><i class="lgd bad"></i>En retard</span>
    <span><i class="lgd"></i>À venir</span><span><i class="lgl"></i>Aujourd’hui</span></div>`;
  return s;
}

function retro(c) {
  if (c.fin == null) return '<div class="muted">Renseignez la date de fin prévue pour afficher le rétroplanning.</div>';
  const steps = [{l: 'Échéance (fin prévue)', t: c.fin, k: 'fin', sub: 'Échéance'}];
  c.jal.filter(j => j.t != null).sort((a, b) => b.t - a.t).forEach(j => steps.push({
    l: j.l, t: j.t, k: j.s === 'Atteint' ? 'ok' : j.late ? 'bad' : '', sub: j.s === 'Atteint' ? 'Atteint' : j.late ? 'En retard' : 'À venir'}));
  if (c.deb != null) steps.push({l: 'Début du projet', t: c.deb, k: 'deb', sub: 'Début'});
  const sansDate = c.jal.filter(j => j.t == null).map(j => j.l);

  let mn = Math.min(...steps.map(x => x.t)), mx = Math.max(...steps.map(x => x.t));
  if (c.overdue) mx = Math.max(mx, c.now);
  if (mx - mn < DAY) mx = mn + DAY * 30;
  const P = t => ((t - mn) / (mx - mn) * 100).toFixed(2);
  const showToday = c.now >= mn && c.now <= mx;

  const rowsHtml = steps.map(st => {
    const dot = st.k === 'ok' ? 'ok' : st.k === 'bad' ? 'bad' : st.k === 'deb' ? 'acc' : st.k === 'fin' ? 'fin' : '';
    let bar = '';
    if (st.k !== 'fin') {
      const a = Math.min(st.t, c.fin), b = Math.max(st.t, c.fin);
      bar = `<i class="rp-bar ${st.k}" style="left:${P(a)}%;width:${(P(b) - P(a)).toFixed(2)}%"></i>`;
    }
    return `<div class="rp-r">
      <div class="rp-l"><span class="dot ${dot}"></span><span><b>${esc(st.l)}</b><small>${fmtD(st.t)}</small></span></div>
      <div class="rp-t">${showToday ? `<i class="rp-td" style="left:${P(c.now)}%"></i>` : ''}${bar}<i class="rp-mk ${st.k}" style="left:${P(st.t)}%"></i></div>
      <div class="rp-j">${st.k === 'fin' ? 'J' : jLabel(c.fin, st.t)}<small>${st.sub}</small></div></div>`;
  }).join('');

  return `<div class="rp"><div class="rp-h"><span>Étape (de l’échéance vers le début)</span><span>Temps avant l’échéance</span><span>Échéance</span></div>${rowsHtml}</div>
    ${sansDate.length ? `<div class="muted" style="margin-top:8px">Jalons sans date : ${esc(sansDate.join(', '))}</div>` : ''}
    <div class="lg"><span><i class="lgd fin"></i>Échéance</span><span><i class="lgd ok"></i>Atteint</span><span><i class="lgd bad"></i>En retard</span>
    <span><i class="lgd deb"></i>À venir / début</span><span><i class="lgl"></i>Aujourd’hui</span></div>`;
}

function calendrier(r) {
  const c = calData(r);
  let sum = '';
  if (c.deb != null && c.fin != null) sum = `Du ${fmtD(c.deb)} au ${fmtD(c.fin)}`;
  let etat = '';
  if (c.reel != null) etat = `Terminé le ${fmtD(c.reel)}`;
  else if (c.fin != null) {
    const d = Math.round((c.fin - c.now) / DAY);
    etat = d > 0 ? `Échéance dans ${plural(d, 'jour')}` : d === 0 ? 'Échéance aujourd’hui' : `Échéance dépassée de ${plural(-d, 'jour')}`;
  }
  const sumTxt = [sum, etat].filter(Boolean).join(' · ');
  const on = v => calView === v ? 'on' : '';
  return `<div class="card cal" data-view="${calView}" style="margin-top:14px">
    <div class="cal-h"><h2>Calendrier</h2>
      <div class="seg" role="group" aria-label="Type de vue">
        <button type="button" data-view="frise" class="${on('frise')}" aria-pressed="${calView === 'frise'}">Frise chronologique</button>
        <button type="button" data-view="retro" class="${on('retro')}" aria-pressed="${calView === 'retro'}">Rétroplanning</button>
      </div></div>
    ${sumTxt ? `<div class="cal-sum ${c.overdue ? 'bad' : ''}">${sumTxt}</div>` : ''}
    <div class="cv cv-frise"><div class="cvt">Frise chronologique</div>${frise(c)}</div>
    <div class="cv cv-retro"><div class="cvt">Rétroplanning</div>${retro(c)}</div></div>`;
}

/* ---------- Rendu : projet ---------- */
function renderProjet(r) {
  const prev = num(r.Charge_prevue), reel = num(r.Charge_reelle), taux = prev ? reel / prev : 0;
  const lv = level(taux);
  const etat = !prev ? '' : taux > 1 ? 'Dépassement' : taux >= 0.8 ? '> 80 %' : 'OK';

  const jal = parse(r.Jalons_json).filter(j => j.l || j.d);
  const done = jal.filter(j => j.s === 'Atteint').length;
  const jalHtml = jal.length ? jal.map(j => `<div class="ms"><span class="dot ${j.s === 'Atteint' ? 'ok' : j.s === 'En retard' ? 'bad' : ''}"></span>
      <span>${esc(j.l) || '—'}</span><span class="d">${esc(fmtD(j.d)) || '—'}</span></div>`).join('')
    : '<span class="muted">Aucun jalon renseigné</span>';

  const comm = [r.Niveau_commanditaire, r.Commanditaire].filter(Boolean).join(' – ');
  const line = (k, v) => `<div class="row"><span class="k">${k}</span><span class="v">${esc(v) || '—'}</span></div>`;

  return `
  <div class="eyebrow">${esc((r.Reference || '').trim())}</div>
  <h1>${esc(r.Titre) || '(Sans titre)'}</h1>
  <div class="chips">${r.Type_nom ? `<span class="chip">${esc(r.Type_nom)}</span>` : ''}
    ${r.Statut ? `<span class="chip">${esc(r.Statut)}</span>` : ''}
    ${r.Retard ? '<span class="chip bad">En retard</span>' : ''}</div>
  ${calendrier(r)}
  <div class="card"><h2>Charge de travail</h2>
    ${prev ? `<div style="margin-bottom:10px">${fmtN(reel)} j réalisés sur ${fmtN(prev)} j prévus (${pct(taux)} %)
      <span class="chip ${lv === 'bad' ? 'bad' : lv === '' ? 'ok' : ''}" style="margin-left:8px">${etat}</span></div>
      <div class="bar"><i class="${lv}" style="width:${clamp(taux) * 100}%"></i></div>`
      : `<span class="muted">Charge prévue non renseignée (${fmtN(reel)} j réalisés)</span>`}</div>
  <div class="card"><h2>Intervenants</h2>
    ${line('Commanditaire', comm)}${line('Bénéficiaire', r.Beneficiaire)}${line('Agents BET', r.Agent_nom)}${line('Suivi', r.Suivi_nom)}</div>
  <div class="card"><h2>Jalons (${jal.length ? Math.round(done / jal.length * 100) : 0} % atteints)</h2>${jalHtml}</div>
  <div class="card"><h2>Description</h2>${r.Description ? `<div class="desc">${esc(r.Description)}</div>` : '<span class="muted">Aucune description</span>'}</div>`;
}

/* ---------- Rendu : agent ---------- */
function renderAgent(r) {
  const cap = num(r.Capacite_annuelle), prev = num(r.Charge_prevue), tx = num(r.Taux_occupation);
  const fonction = (r.Fonction || '').split(/\n+/).map(s => s.trim()).filter(Boolean).join(' · ');
  const subHtml = [esc(fonction), r.Email ? `<a style="color:inherit" href="mailto:${esc(r.Email)}">${esc(r.Email)}</a>` : ''].filter(Boolean).join(' · ');
  const projets = parse(r.Projets_json);
  const pj = projets.length ? projets.map(p => {
    const t = p.p ? p.r / p.p : 0;
    return `<div class="pj"><div class="t"><b>${esc(p.t) || '(Sans titre)'}</b><span class="chip">${esc(p.s)}</span></div>
      <div class="muted" style="margin-bottom:6px">${fmtN(p.r)} j réalisés sur ${fmtN(p.p)} j prévus</div>
      <div class="bar"><i class="${level(t)}" style="width:${clamp(t) * 100}%"></i></div></div>`;
  }).join('') : '<span class="muted">Aucun projet pour le moment.</span>';
  const kpi = (v, l) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`;

  return `
  <div class="head">
    <div class="avatar" aria-hidden="true">${esc((r.Prenom || r.Nom_complet || '?').trim().charAt(0).toUpperCase())}</div>
    <div><h1 style="margin:0">${esc(r.Nom_complet)}</h1>
      <div class="muted">${subHtml}</div>
      <div class="chips" style="margin:8px 0 0">${r.Referent_suivi ? '<span class="chip">Référent·e de suivi</span>' : ''}${r.Actif === false ? '<span class="chip bad">Inactif</span>' : ''}</div></div>
  </div>
  <div class="card"><div class="kpis">
    ${kpi(num(r.Nb_projets_actifs), 'projets en cours')}${kpi(num(r.Nb_projets_suivis), 'projets suivis')}
    ${kpi(fmtN(r.Charge_reelle_annee) + ' j', 'réalisés cette année')}${kpi(fmtN(cap) + ' j', 'capacité annuelle')}</div></div>
  <div class="card">
    <h2>Occupation sur l’année : ${pct(tx)} %</h2>
    <div class="bar" style="margin-bottom:18px"><i class="${level(tx)}" style="width:${clamp(tx) * 100}%"></i></div>
    <h2>Charge prévue par projet (${fmtN(prev)} j sur ${fmtN(cap)} j)</h2>
    <div class="bar"><i class="acc" style="width:${cap ? clamp(prev / cap) * 100 : 0}%"></i></div></div>
  <div class="card"><h2>Projets portés</h2>${pj}</div>`;
}

/* ---------- Navigation ---------- */
function buildSelect() {
  $('sel').innerHTML = rows.map(r => `<option value="${r.id}">${esc(label(r))}</option>`).join('');
}
function render() {
  const i = rows.findIndex(r => r.id === cur);
  const r = rows[i];
  $('sel').value = r ? String(r.id) : '';
  $('cnt').textContent = rows.length ? `${i + 1} / ${rows.length}` : '';
  $('prev').disabled = i <= 0;
  $('next').disabled = i < 0 || i >= rows.length - 1;
  $('print').disabled = $('csv').disabled = !r;
  $('fiche').innerHTML = r ? (mode === 'projet' ? renderProjet(r) : renderAgent(r))
                           : '<div class="empty">Aucune fiche à afficher.</div>';
  document.title = r ? label(r) : 'Fiche';
}
function go(id) {
  if (id == null || id === cur) return;
  cur = id; render();
  try { grist.setCursorPos({rowId: id}); } catch (e) {}
  $('fiche').parentElement.scrollTop = 0;
}
function step(d) {
  const i = rows.findIndex(r => r.id === cur), n = rows[i + d];
  if (n) go(n.id);
}
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('sel').onchange = e => go(Number(e.target.value));
$('fiche').addEventListener('click', e => {
  const b = e.target.closest('.seg button');
  if (!b) return;
  calView = b.dataset.view;
  const card = b.closest('.cal');
  card.dataset.view = calView;
  card.querySelectorAll('.seg button').forEach(x => {
    const on = x.dataset.view === calView;
    x.classList.toggle('on', on);
    x.setAttribute('aria-pressed', on);
  });
});
document.addEventListener('keydown', e => {
  if (/^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName) || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
});

/* ---------- Impression / PDF et export CSV ---------- */
$('print').onclick = () => window.print();
$('csv').onclick = () => {
  const r = rows.find(x => x.id === cur); if (!r) return;
  let data;
  if (mode === 'projet') {
    data = [['Référence', r.Reference], ['Titre', r.Titre], ['Type', r.Type_nom], ['Statut', r.Statut],
      ['Niveau commanditaire', r.Niveau_commanditaire], ['Commanditaire', r.Commanditaire], ['Bénéficiaire', r.Beneficiaire],
      ['Agents', r.Agent_nom], ['Suivi', r.Suivi_nom], ['Date de début', fmtD(r.Date_debut)],
      ['Date de fin prévue', fmtD(r.Date_fin_prevue)], ['Date de fin réelle', fmtD(r.Date_fin_reelle)],
      ['Charge prévue (j)', r.Charge_prevue], ['Charge réelle (j)', r.Charge_reelle], ['Taux de consommation', pct(r.Taux_conso) + ' %'],
      ['Description', r.Description]];
    const c = calData(r);
    if (c.fin != null && c.reel == null) data.push(['Jours avant l’échéance', Math.round((c.fin - c.now) / DAY)]);
    c.jal.forEach((j, i) => data.push([`Jalon ${i + 1}`,
      `${j.l} | ${j.t != null ? fmtD(j.t) : ''} | ${j.late && j.s !== 'En retard' ? 'En retard' : j.s} | ${j.t != null && c.fin != null ? jLabel(c.fin, j.t) : ''}`]));
  } else {
    data = [['Nom', r.Nom_complet], ['Fonction', (r.Fonction || '').replace(/\n+/g, ' · ')], ['Email', r.Email],
      ['Référent·e de suivi', r.Referent_suivi ? 'Oui' : 'Non'], ['Actif', r.Actif === false ? 'Non' : 'Oui'],
      ['Capacité annuelle (j)', r.Capacite_annuelle], ['Réalisés cette année (j)', r.Charge_reelle_annee],
      ['Charge prévue (j)', r.Charge_prevue], ['Taux d’occupation', pct(r.Taux_occupation) + ' %'],
      ['Projets en cours', r.Nb_projets_actifs], ['Projets suivis', r.Nb_projets_suivis]];
    parse(r.Projets_json).forEach((p, i) => data.push([`Projet ${i + 1}`, `${p.t} | ${p.s} | ${fmtN(p.p)} j prévus | ${fmtN(p.r)} j réalisés`]));
  }
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const csv = '﻿' + [['Champ', 'Valeur'], ...data].map(l => l.map(q).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
  a.download = 'fiche-' + label(r).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
};

/* ---------- Connexion à Grist ---------- */
grist.ready({requiredAccess: 'full'});
grist.onRecords(recs => {
  rows = recs;
  if (!mode && recs.length) mode = 'Titre' in recs[0] ? 'projet' : 'Nom_complet' in recs[0] ? 'agent' : null;
  buildSelect();
  if (!rows.some(r => r.id === cur)) cur = rows.length ? rows[0].id : null;
  render();
});
grist.onRecord(r => {
  if (r && r.id && r.id !== cur && rows.some(x => x.id === r.id)) { cur = r.id; render(); }
});
</script>
</body>
</html>
